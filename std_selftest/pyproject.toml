[project]
name = "ihelp"
version = "0.1.0"
description = "iHelp Ch01: pure chat customer service backend"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2,<1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema==4.26.0",
    "langchain==1.4.2",
    "langchain-core==1.6.5",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.6",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "mcp==1.30.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.5,<3.0",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "pywin32>=312",
    "ragas>=0.4.3",
    "rapidocr-onnxruntime>=1.4.4",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "RAG_test/tests"]
